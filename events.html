
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | CampusHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: #243b80;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 28px;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd166;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 35px;
        }

        .intro h2 {
            color: #243b80;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .intro p {
            color: #666;
            line-height: 1.6;
        }

        .events {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .event-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #4361ee;
        }

        .date {
            color: #4361ee;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .event-card h3 {
            margin-bottom: 12px;
            color: #243b80;
        }

        .event-card p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .tag {
            display: inline-block;
            background: #e8edff;
            color: #243b80;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 8px;
        }

        footer {
            text-align: center;
            padding: 22px;
            background: #243b80;
            color: white;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .intro h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

            <a href="courses.html">Courses</a>
            <a href="announcements.html">Announcements</a>
            <a href="events.html">Events</a>
        </nav>
    </header>
